# Keeps both kinds of dependency current, batched into one PR per ecosystem so
# a round of updates costs one CI run instead of several:
#
#   uv      — uv.lock, which CI installs from with `uv sync --locked`, so it
#             tracks current Streamlit and its dependencies.
#   actions — the actions the test workflow runs. Those are referenced by a
#             moving major tag (@v7) or an exact release (@v10.3.2, because
#             setup-uv stopped publishing major aliases after v7) rather than
#             commit SHAs, so without this entry they would quietly fall behind.
version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "daily"
    groups:
      python-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    # Actions majors land a few times a year, so weekly is enough; grouping keeps
    # a round of bumps to a single PR that CI can then verify.
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"
