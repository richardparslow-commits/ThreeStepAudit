# Runs the test suite on every push and pull request.
#
# The suite is the only gate the repo needs today: `unittest` already covers the
# data model, storage, report rendering and — via Streamlit's AppTest — the page
# wiring itself, so there is no separate lint or type-check step.
name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: unittest (Python 3.14)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        # Pinned to an exact release, not a moving major: setup-uv stopped
        # publishing `vN` aliases after v7, so `@v9` (which does exist as
        # v9.0.0) has no alias to resolve and the job dies before any test.
        uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true

      - name: Install the Python version pinned in .python-version
        run: uv python install

      # Fails before anything is installed when pyproject.toml changed without a
      # `uv lock` in the same commit, naming the lockfile as the problem. The
      # sync below would also refuse a stale lock, but only after building the
      # environment, and its error reads as a sync failure rather than a stale
      # lock. `--check` never rewrites the file, so CI cannot paper over it.
      - name: Check the lock matches pyproject.toml
        run: uv lock --check

      # Belt and braces: --locked also makes the install refuse to re-resolve,
      # so nothing is installed from a resolution this workflow hasn't seen.
      - name: Install dependencies from the lock
        run: uv sync --locked

      - name: Run tests
        run: uv run python -m unittest discover -s tests -t . -v
